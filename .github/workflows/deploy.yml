name: Test and Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: false
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tami_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, zip, pdo_mysql

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Generate app key
        run: php artisan key:generate

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h127.0.0.1 -P3306 -uroot -proot --silent; do
            sleep 2
          done

      - name: Run migrations against MySQL
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tami_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Run test suite against MySQL
        run: vendor/bin/phpunit -c phpunit.ci.xml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: ANTHROPIC_API_KEY
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull origin main
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            npm ci
            npm run build
            # Клучот за читање скенирани фактури живее како GitHub тајна, не во
            # складиштето — до серверот нема рачен пристап. Се запишува во .env
            # при секое пуштање, па GitHub е единственото место каде се менува:
            # избришана тајна значи празен клуч, а празен клуч значи дека
            # функцијата е скриена. Мора пред config:cache — по кеширањето
            # Laravel повеќе не го чита .env. Се пишува преку `cat >`, не `mv`,
            # за .env да ги задржи своите дозволи.
            tmp_env="$(mktemp)"
            grep -v '^ANTHROPIC_API_KEY=' .env > "$tmp_env" || true
            printf 'ANTHROPIC_API_KEY=%s\n' "${ANTHROPIC_API_KEY:-}" >> "$tmp_env"
            cat "$tmp_env" > .env
            rm -f "$tmp_env"
            php artisan config:clear
            php artisan config:cache
            # Потврда во дневникот на распоредувањето без да се открие клучот:
            # се печати само дали е поставен.
            php artisan tinker --execute="echo 'Читање скенови: ' . (filled(config('services.anthropic.key')) ? 'КЛУЧОТ Е ПОСТАВЕН' : 'нема клуч, функцијата е скриена') . PHP_EOL;"
            php artisan route:cache
            php artisan view:cache
            chown -R www-data:www-data .
